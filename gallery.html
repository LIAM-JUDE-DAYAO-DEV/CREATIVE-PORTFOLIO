
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAYAO'S CREATIVES - Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #dce9e4;
            color: #263c38;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #283936;
            color: white;
            width: 100%;
        }

        .top-header {
            height: 105px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            border-bottom: 1px solid #71827e;
        }

        .logo {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 3px solid #b7d8c9;
            object-fit: cover;
        }

        .brand {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav {
            min-height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 23px 45px;
            font-size: 17px;
            font-weight: bold;
            display: inline-block;
        }

        nav a:hover,
        nav a.active {
            background-color: #3e514c;
        }


        main {
            flex: 1;
            width: 100%;
            padding: 20px;
        }

        .portfolio-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            border: 1px solid #e5e5ef;
            padding: 20px;
            text-align: center;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
        }

        .portfolio-container h1 {
            font-size: 34px;
            color: #263c38;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            color: #263c38;
            margin-bottom: 30px;
        }

        .profiles-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 30px 20px;
            justify-items: center;
            width: 100%;
        }

        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        .profile-card img {
            width: 100%;
            max-width: 120px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #607d73;
            margin-bottom: 12px;
            background-color: #ccc;
        }

        .profile-card span {
            font-size: 13px;
            font-weight: bold;
            color: #607d73;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        footer {
            background-color: #283936;
            color: white;
            text-align: center;
            padding: 22px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .profiles-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            nav a {
                padding: 20px 25px;
            }
        }

        @media (max-width: 700px) {
            .top-header {
                height: 90px;
                gap: 10px;
            }

            .logo {
                width: 45px;
                height: 45px;
            }

            .brand {
                font-size: 20px;
                letter-spacing: 1px;
            }

            nav a {
                padding: 15px 12px;
                font-size: 13px;
            }

            main {
                padding: 15px;
            }

            .portfolio-container {
                padding: 30px 15px;
            }

            .portfolio-container h1 {
                font-size: 27px;
            }

            .subtitle {
                font-size: 14px;
                margin-bottom: 25px;
            }

            .profile-card img {
                max-width: 100px;
            }

            .profiles-grid {
                gap: 25px 15px;
            }
        }

        @media (max-width: 400px) {
            .profiles-grid {
                grid-template-columns: 1fr;
            }

            .brand {
                font-size: 17px;
            }

            nav a {
                padding: 15px 9px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
